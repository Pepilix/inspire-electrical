# Builds the site and publishes it to GitHub Pages.
# Repository settings → Pages → Source must be "GitHub Actions".
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL     e.g. https://pepilix.github.io   or   https://inspire-electrical.com
#   BASE_PATH    e.g. /inspire-electrical/        or   /
#   PRODUCTION   "true" only for the live domain
#   PUBLIC_FORM_ENDPOINT, PUBLIC_GTM_ID   (optional until launch)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://pepilix.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/inspire-electrical/' }}
      PRODUCTION: ${{ vars.PRODUCTION || 'false' }}
      PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
